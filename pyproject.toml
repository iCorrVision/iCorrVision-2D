[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "icorrvision"
version = "2.0.0"
description = "Modular subset-based 2D digital image correlation engine with a PySide6 interface"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "João Pedro da Silva Duarte Récio" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "tomli-w>=1.2",
]

[project.optional-dependencies]
gui = ["PySide6==6.10.2", "Pillow"]
notebooks = ["jupyter>=1.1.1", "ipykernel>=7.3.0", "nbconvert", "pandas>=2.1"]
acceleration = ["numba>=0.67", "pyopencl>=2026.1"]
dev = ["black", "isort", "mypy", "scipy-stubs"]

[project.urls]
Repository = "https://github.com/iCorrVision/iCorrVision-2D"

[project.scripts]
icorr = "icorrvision.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
