name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install ".[gui]" pyinstaller

      - run: >
          pyinstaller --onedir --collect-all PySide6
          --name icorr-correlation
          --paths src
          src/icorrvision/gui/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: icorr-correlation-windows
          path: dist/icorr-correlation
